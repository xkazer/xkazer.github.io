<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="css/skeleton.css?v=5">
  <link rel="stylesheet" type="text/css" href="css/common.css?v=5">
  <link rel="stylesheet" type="text/css" href="css/game.css?v=5">
  <title>xkazer</title>
</head>
<body>
  <script src="js/rain.js?v=5"></script>
  <canvas id="ad"></canvas>
  <div class="app">
    <main>
      <div class="game-bar">
        <span>分数<b id="score">0</b></span>
        <span>方块<b id="bricks">0</b></span>
        <span>球<b id="balls">3</b></span>
        <span>关卡<b id="level">1</b></span>
        <span class="spacer"></span>
        <button id="restart" class="ghost-btn">重开</button>
      </div>
      <div class="stage">
        <canvas id="game"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <p id="overlayTitle" class="overlay-title">准备好了吗</p>
            <p id="overlayDesc" class="overlay-desc">移动鼠标，上下左右四块挡板会同时跟着你走</p>
            <button id="startBtn" class="primary-btn">开始</button>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备2022072679号-1</a>
    </footer>
  </div>
  <script src="js/game.js?v=5"></script>
</body>
</html>
