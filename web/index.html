<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="css/main.css?v=1">
  <title>xkazer</title>
</head>
<body>
  <div class="page">
    <header class="search">
      <form id="searchForm" class="search-box" autocomplete="off">
        <button type="submit" class="search-icon" aria-label="搜索">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>
        </button>
        <input id="searchInput" type="text" placeholder="搜索任何内容" aria-label="搜索关键词">
        <div id="engines" class="engines" role="tablist">
          <button type="button" class="engine" data-engine="baidu">百度</button>
          <button type="button" class="engine" data-engine="bing">必应</button>
          <button type="button" class="engine engine-google" data-engine="google">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
          </button>
        </div>
      </form>
    </header>

    <main class="panel">
      <nav id="tabs" class="tabs" role="tablist">
        <button type="button" class="tab" data-tab="tools" role="tab">工具</button>
        <button type="button" class="tab" data-tab="fun" role="tab">娱乐</button>
        <button type="button" class="tab" data-tab="maxim" role="tab">格言</button>
      </nav>

      <section id="pane-tools" class="pane" role="tabpanel">
        <div class="grid" id="toolsGrid"></div>
      </section>

      <section id="pane-fun" class="pane" role="tabpanel" hidden>
        <div class="grid" id="funGrid"></div>
      </section>

      <section id="pane-maxim" class="pane" role="tabpanel" hidden>
        <div class="maxim-today">
          <p id="maximText" class="maxim-text">加载中...</p>
          <p id="maximSource" class="maxim-source"></p>
          <div class="maxim-actions">
            <button type="button" id="maximRandom" class="pill">随机一条</button>
            <button type="button" id="maximCopy" class="pill">复制</button>
          </div>
        </div>
        <div id="maximList" class="maxim-list"></div>
      </section>
    </main>

    <footer class="footer">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2022072679号-1</a>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/main.js?v=2"></script>
</body>
</html>
