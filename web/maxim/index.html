<h3>人生</h3>
<div class="maxim-item"><span>情绪不是需要解决的问题，而是需要接受的事实。</span><span class="src">2026.11</span></div>
<div class="maxim-item"><span>对可控的事情，保持谨慎，对不可控的事情，保持乐观。</span><span class="src">2023.9</span></div>
<div class="maxim-item"><span>周末喝着自己熬的粥，看着海贼王，幸福就是这么简单。</span><span class="src">2014.11</span></div>
<div class="maxim-item"><span>天下熙攘，皆为名来利往。斗转星移，不悟悲欢合离。</span><span class="src">2014.10</span></div>
<div class="maxim-item"><span>向左的理由，向右的理由，理由再多，迈不出去脚还是迈不出去。</span><span class="src">2014.9</span></div>
<div class="maxim-item"><span>软弱的人做恶最深。</span><span class="src">2013.12</span></div>
<div class="maxim-item"><span>就像歌德巴赫猜想，好像就在那里，但我无法证明。</span><span class="src">2013.5</span></div>
<div class="maxim-item"><span>因为喜欢，所以卑贱。</span><span class="src">2013.3</span></div>
<div class="maxim-item"><span>因为无能为力,所以顺其自然。因为心无所恃,所以随遇而安。</span><span class="src">2012.8</span></div>
</div>
