<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>孤岛 · 月夜</title>
<style>
  :root {
    --ink: #05070f;
    --bone: #e7e6df;
    --bone-dim: rgba(231, 230, 223, .58);
    --moon: #cfe0ff;
    --sig: #ffca7a;
    --line: rgba(231, 230, 223, .16);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif;
    color: var(--bone); -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  /* ---------- 顶部 ---------- */
  .hud-top {
    position: absolute; left: max(20px, env(safe-area-inset-left)); top: calc(18px + var(--sat));
    display: flex; flex-direction: column; gap: 10px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .mark {
    font-size: clamp(22px, 3.2vw, 34px); font-weight: 800; letter-spacing: .22em;
    text-shadow: 0 0 22px rgba(160, 190, 255, .35);
  }
  .brand .sub {
    font-size: 10px; letter-spacing: .34em; color: var(--bone-dim); text-transform: uppercase;
  }
  .hint {
    margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--bone-dim);
    opacity: 0; animation: fadeUp 1.2s 1.4s ease forwards;
  }

  /* ---------- 底部 ---------- */
  .hud-bottom {
    position: absolute; left: 50%; bottom: calc(28px + var(--sab)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; pointer-events: auto;
    opacity: 0; animation: fadeUp 1.2s 1.1s ease forwards;
  }
  .pill {
    -webkit-appearance: none; appearance: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 20px; border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(8, 12, 20, .55);
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    color: var(--bone); font-size: 13px; letter-spacing: .12em; font-family: inherit;
    transition: border-color .25s, background .25s, transform .18s, box-shadow .35s;
  }
  .pill:hover { border-color: rgba(231, 230, 223, .34); background: rgba(12, 18, 28, .68); }
  .pill:active { transform: scale(.97); }
  .pill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(231, 230, 223, .38);
    box-shadow: none; transition: background .25s, box-shadow .35s;
  }
  .pill[aria-pressed="true"] {
    border-color: rgba(255, 202, 122, .5);
    box-shadow: 0 0 26px rgba(255, 190, 110, .18), inset 0 0 18px rgba(255, 190, 110, .06);
    color: #ffe9c9;
  }
  .pill[aria-pressed="true"] .dot {
    background: var(--sig); box-shadow: 0 0 10px rgba(255, 202, 122, .95);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .pill.ghost { padding: 11px 16px; font-size: 12px; color: var(--bone-dim); }

  /* ---------- 返回 ---------- */
  .back {
    position: absolute; right: max(18px, env(safe-area-inset-right)); top: calc(18px + var(--sat));
    pointer-events: auto; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 15px; border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(8, 12, 20, .45);
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    color: var(--bone-dim); font-size: 12px; letter-spacing: .12em;
    transition: border-color .25s, background .25s, color .25s;
  }
  .back:hover { color: var(--bone); border-color: rgba(231, 230, 223, .34); background: rgba(12, 18, 28, .68); }

  /* ---------- FPS ---------- */
  .fps {
    position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: calc(26px + var(--sab));
    font-size: 10px; letter-spacing: .18em; color: rgba(231, 230, 223, .28); font-variant-numeric: tabular-nums;
  }

  /* ---------- 启动 ---------- */
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center; background: #05070f; z-index: 20;
    transition: opacity .9s ease; padding: 24px;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  .boot-inner { text-align: center; }
  .boot-mark { font-size: clamp(20px, 3vw, 28px); font-weight: 800; letter-spacing: .3em; }
  .boot-tip { margin-top: 14px; font-size: 11px; letter-spacing: .24em; color: rgba(231,230,223,.42); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (max-width: 560px) {
    .hint { display: none; }
    .brand .sub { display: none; }
    .hud-bottom { gap: 6px; }
    .hud-bottom .pill { padding: 9px 12px; font-size: 12px; letter-spacing: .06em; }
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>

<div id="ui">
  <a class="back" href="../index.html#scene">← 返回幻境</a>

  <header class="hud-top">
    <div class="brand">
      <span class="mark">孤岛</span>
      <span class="sub">Moonlit Isle</span>
    </div>
    <p class="hint">拖拽旋转 · 滚轮缩放 · 空格烟花 · F 单发烟花 · M 流星 · G 单颗流星 · R 重置视角 · S 音效 · Esc 返回</p>
  </header>

  <div class="hud-bottom">
    <button id="btn-fw" class="pill" aria-pressed="false" title="切换烟花（空格）">
      <span class="dot"></span><span class="label">开启烟花</span>
    </button>
    <button id="btn-met" class="pill" aria-pressed="false" title="切换流星（M）">
      <span class="dot"></span><span class="label">开启流星</span>
    </button>
    <button id="btn-snd" class="pill" aria-pressed="true" title="切换音效（S）">
      <span class="dot"></span><span class="label">音效开</span>
    </button>
    <button id="btn-reset" class="pill ghost" title="重置视角（R）">重置视角</button>
  </div>

  <div class="fps" id="fps"></div>
</div>

<div id="boot"><div class="boot-inner">
  <div class="boot-mark">孤岛 · 月夜</div>
  <div class="boot-tip">正在点亮星空…</div>
</div></div>

<script src="./three.slim.r180.min.js"></script>
<script src="./island-moon.js"></script>
</body>
</html>
